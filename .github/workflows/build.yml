name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:

env:
  SYMGEN_VERSION: v1.3.6

jobs:
  prepare:
    name: Prepare shared artwork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upload shared banner
        uses: actions/upload-artifact@v7
        with:
          name: shared-banner-png
          path: res/banner.png
          if-no-files-found: error

  build:
    name: Build ${{matrix.platform}}
    if: github.ref != 'refs/heads/twilit-compat-rebuild'
    needs: prepare
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Download shared banner
        uses: actions/download-artifact@v8
        with:
          name: shared-banner-png
          path: res

      - name: Remove JPG banner source from distributable resources
        shell: bash
        run: rm -f res/banner.jpg

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Install Android NDK
        if: matrix.android_ndk
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{matrix.android_ndk}}

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{matrix.cmake_args}})
          if [[ -n "${{matrix.android_ndk}}" ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{matrix.android_ndk}}/build/cmake/android.toolchain.cmake"
                   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28)
          fi
          cmake -B build "${args[@]}"

      - name: Print mod compile command
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("build/compile_commands.json").read_text())
          for entry in data:
              if entry.get("file","").endswith("/src/mod.cpp"):
                  print(entry.get("command") or entry.get("arguments"))
          PY

      - name: Build
        run: cmake --build build --parallel --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  dev-build:
    name: Build dev windows-amd64
    if: github.ref == 'refs/heads/twilit-compat-rebuild'
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download shared banner
        uses: actions/download-artifact@v8
        with:
          name: shared-banner-png
          path: res

      - name: Remove JPG banner source from distributable resources
        shell: bash
        run: rm -f res/banner.jpg

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-Windows-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install ninja
        run: choco install ninja

      - name: Configure CMake (Developer)
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTP_CLASSIC_DEV_OPTIONS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Upload dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-dev-windows-amd64
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    if: github.ref != 'refs/heads/twilit-compat-rebuild' && github.ref != 'refs/heads/abi-layout-diagnostic'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/*/*.dusk

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "$GITHUB_REF_NAME" combined/*.dusk --verify-tag --generate-notes
