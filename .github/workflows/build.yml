name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:

env:
  SYMGEN_VERSION: v1.3.6

jobs:
  prepare:
    name: Prepare shared artwork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Convert banner to PNG once
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/convert_banner.py

      - name: Upload shared banner
        uses: actions/upload-artifact@v7
        with:
          name: shared-banner-png
          path: res/banner.png
          if-no-files-found: error

  build:
    name: Build ${{matrix.platform}}
    needs: prepare
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: Download shared banner
        uses: actions/download-artifact@v8
        with:
          name: shared-banner-png
          path: res

      - name: Remove JPG banner source from distributable resources
        shell: bash
        run: rm -f res/banner.jpg

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Install Android NDK
        if: matrix.android_ndk
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{matrix.android_ndk}}

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{matrix.cmake_args}})
          if [[ -n "${{matrix.android_ndk}}" ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{matrix.android_ndk}}/build/cmake/android.toolchain.cmake"
                   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28)
          fi
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Package Windows test bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: mod-windows-amd64
          path: dist

      - name: Upload test bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: dist/*.dusk
          if-no-files-found: error
