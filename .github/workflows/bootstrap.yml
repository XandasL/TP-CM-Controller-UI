name: Bootstrap project

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract prepared project
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/project.tar.xz
          mkdir -p extracted
          tar -xJf .bootstrap/project.tar.xz -C extracted
          root="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          cp -a "$root"/. .
          rm -rf extracted .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import TP Classic Modern Controller UI multiplatform project"
          git push origin HEAD:main
