name: Bootstrap project

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import prepared project
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/project.tar.xz ]]; then
            echo "Bootstrap archive already consumed; nothing to do."
            exit 0
          fi
          mkdir -p extracted
          tar -xJf .bootstrap/project.tar.xz -C extracted
          root="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          rm -rf "$root/.github"
          cp -a "$root"/. .
          rm -rf extracted .bootstrap

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import TP Classic Modern Controller UI project files"
          git push origin HEAD:main
